<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkTex 6535 工装面料销售智能助手 · 演示版</title>
  <style>
    :root { --navy:#12243a; --ink:#1c2d42; --muted:#718096; --line:#d9e2ec; --bg:#f5f7fb; --card:#fff; --teal:#0f766e; --teal-wash:#e7f5f3; --amber:#a15c00; --amber-wash:#fff5df; --red:#b42318; --red-wash:#fff0ef; --blue:#2563eb; --blue-wash:#eef4ff; --shadow:0 8px 28px rgba(15,34,58,.06); }
    * { box-sizing:border-box; }
    *[hidden] { display:none !important; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,select,input { font:inherit; }
    button { cursor:pointer; }
    .app { min-height:100vh; display:flex; }
    .login-screen { min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#eef6f6 0%,#f5f7fb 52%,#edf2ff 100%); padding:24px; }
    .login-screen[hidden] { display:none; }
    .login-card { width:min(680px,100%); background:#fff; border:1px solid var(--line); box-shadow:0 18px 50px rgba(15,34,58,.12); border-radius:16px; padding:30px; }
    .login-brand { padding:0 0 20px; color:var(--navy); }
    .login-card h1 { font-size:28px; margin:4px 0 3px; }
    .login-roles { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0 16px; }
    .role-card { border:1px solid var(--line); border-radius:11px; background:#fbfcfe; padding:17px; text-align:left; color:var(--ink); display:flex; flex-direction:column; gap:7px; }
    .role-card:hover { border-color:#7bcac0; background:var(--teal-wash); }
    .role-card strong { font-size:16px; }
    .role-card span { color:var(--muted); font-size:12px; line-height:1.5; }
    .role-card em { color:var(--teal); font-size:12px; font-style:normal; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .sidebar { width:230px; background:var(--navy); color:#d9e5f3; padding:22px 14px; flex:none; }
    .brand { display:flex; align-items:center; gap:10px; padding:0 10px 26px; color:#fff; font-weight:750; letter-spacing:.02em; }
    .brand-mark { width:30px; height:30px; border-radius:9px; background:#61d7c7; color:var(--navy); display:grid; place-items:center; font-weight:900; }
    .nav-label { color:#8fa5bd; font-size:11px; text-transform:uppercase; letter-spacing:.1em; padding:12px 12px 6px; }
    .nav button { width:100%; border:0; background:transparent; color:#c9d7e7; padding:10px 12px; border-radius:8px; text-align:left; margin:2px 0; }
    .nav button:hover,.nav button.active { color:#fff; background:rgba(255,255,255,.11); }
    .side-note { margin:24px 10px 0; border:1px solid rgba(255,255,255,.16); border-radius:9px; padding:11px; color:#a9bbce; font-size:12px; }
    .main { flex:1; min-width:0; }
    .topbar { height:66px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 28px; }
    .crumb { color:var(--muted); font-size:13px; }
    .crumb b { color:var(--ink); }
    .top-actions { display:flex; align-items:center; gap:10px; }
    .demo-badge { background:#fff1cb; color:#8a5600; border:1px solid #f0d38a; padding:5px 9px; border-radius:999px; font-size:12px; font-weight:700; }
    .avatar { width:30px; height:30px; border-radius:50%; background:#dbeafe; color:#1d4ed8; display:grid; place-items:center; font-weight:750; }
    .content { max-width:1440px; margin:0 auto; padding:25px 28px 42px; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    h1 { margin:0; font-size:25px; letter-spacing:-.025em; }
    .subtitle { color:var(--muted); margin-top:4px; }
    .outline-btn,.primary-btn,.danger-btn { border-radius:8px; padding:9px 13px; border:1px solid var(--line); background:#fff; color:var(--ink); }
    .primary-btn { border-color:var(--teal); background:var(--teal); color:#fff; }
    .danger-btn { border-color:#efb7b2; color:var(--red); background:#fff; }
    .outline-btn:hover { background:var(--bg); }
    .date-toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:10px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:10px; padding:11px 13px; margin-bottom:16px; }

    .date-btn.active { border-color:var(--teal); color:var(--teal); background:var(--teal-wash); font-weight:700; }
    .date-field { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:12px; }
    .date-field input,.date-field select { border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:#fff; color:var(--ink); }
    .metrics { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
    .metric { background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:10px; padding:14px 16px; }
    .metric .value { font-size:25px; font-weight:750; color:var(--navy); }
    .metric .label { color:var(--muted); font-size:12px; }

    button.metric:hover { border-color:#7bcac0; background:var(--teal-wash); }

    .grid { display:grid; grid-template-columns:minmax(330px,.92fr) minmax(0,1.55fr); gap:16px; align-items:start; }
    .card { background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:10px; overflow:hidden; }
    .card-head { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); }
    .card-title { font-weight:750; }
    .small { font-size:12px; color:var(--muted); }
    .search { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:8px; }
    .search input { width:100%; border:1px solid var(--line); border-radius:7px; padding:8px 10px; outline:none; }
    .search input:focus { border-color:#8eb4f7; box-shadow:0 0 0 3px #eaf1ff; }
    .lead-list { max-height:620px; overflow:auto; }
    .lead-row { width:100%; display:grid; grid-template-columns:minmax(0,1fr) 38px 56px; gap:8px; text-align:left; border:0; border-bottom:1px solid var(--line); background:#fff; padding:12px 16px; color:var(--ink); }
    .lead-row:hover,.lead-row.selected { background:#f5f9fd; }
    .lead-name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lead-meta { color:var(--muted); font-size:12px; margin-top:2px; }
    .grade { font-weight:800; text-align:center; }
    .grade-a { color:var(--teal); } .grade-b { color:var(--amber); } .grade-c { color:var(--red); }
    .score { color:var(--muted); text-align:right; }
    .detail { min-width:0; }
    .detail-head { padding:17px 18px; border-bottom:1px solid var(--line); }
    .detail-title { display:flex; justify-content:space-between; align-items:start; gap:14px; }
    .detail-title h2 { margin:0; font-size:21px; letter-spacing:-.02em; }
    .status { padding:5px 9px; border-radius:999px; font-size:12px; font-weight:750; white-space:nowrap; }
    .status-a { background:var(--teal-wash); color:var(--teal); } .status-b { background:var(--amber-wash); color:var(--amber); } .status-c { background:var(--red-wash); color:var(--red); }
    .detail-meta { display:flex; flex-wrap:wrap; gap:8px 16px; color:var(--muted); margin-top:6px; }
    .tabs { display:flex; gap:2px; padding:0 18px; border-bottom:1px solid var(--line); overflow:auto; }
    .tab { border:0; border-bottom:2px solid transparent; background:transparent; color:var(--muted); padding:11px 10px 9px; white-space:nowrap; }
    .tab.active { color:var(--navy); border-bottom-color:var(--teal); font-weight:750; }
    .tab-panel { padding:17px 18px 20px; }
    .section-title { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 9px; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:13px; }

    .info-box .v { margin-top:2px; font-weight:650; }

    .evidence .date { color:var(--teal); font-size:12px; font-weight:750; }
    .evidence .excerpt { margin-top:3px; }
    .evidence .source { color:var(--muted); font-size:12px; margin-top:4px; word-break:break-all; }
    .skill-chain { display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-bottom:17px; }
    .skill-step { border:1px solid var(--line); border-radius:8px; padding:10px 8px; text-align:center; color:var(--muted); font-size:12px; background:#fbfcfe; }

    .skill-icon { font-size:17px; display:block; margin-bottom:3px; }

    .kb-row:last-child { border-bottom:0; }
    .kb-id { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:#315d9a; font-size:12px; }
    .kb-score { color:var(--teal); font-weight:750; white-space:nowrap; }
    .draft { border:1px solid #c7d7f7; background:var(--blue-wash); border-radius:8px; padding:13px; white-space:pre-line; }
    .warning { border:1px solid #f0d38a; background:var(--amber-wash); color:#795000; border-radius:8px; padding:11px 12px; margin-top:12px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; }
    .approval { border-top:1px solid var(--line); margin-top:17px; padding-top:14px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .approval-state { color:var(--muted); font-size:12px; }
    .kb-search { display:flex; gap:8px; margin-bottom:10px; }
    .kb-search input { flex:1; border:1px solid var(--line); border-radius:7px; padding:8px 10px; }
    .kb-tag { display:inline-block; background:#edf2f7; color:#526275; border-radius:5px; padding:2px 6px; font-size:11px; margin:3px 4px 0 0; }
    .empty { padding:32px 16px; text-align:center; color:var(--muted); }
    .extra-panel { background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:10px; overflow:hidden; }
    .extra-head { padding:18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:end; gap:16px; }
    .extra-head h2 { margin:0; font-size:20px; }
    .extra-body { padding:18px; }
    .table-wrap { overflow:auto; }
    .data-table { width:100%; border-collapse:collapse; min-width:720px; }
    .data-table th,.data-table td { border-bottom:1px solid var(--line); padding:11px 10px; text-align:left; vertical-align:top; }
    .data-table th { color:var(--muted); font-size:12px; font-weight:650; }
    .data-table tr:last-child td { border-bottom:0; }
    .bar-row { display:grid; grid-template-columns:125px minmax(100px,1fr) 50px; gap:10px; align-items:center; margin:13px 0; }
    .bar-track { height:10px; background:#edf2f7; border-radius:999px; overflow:hidden; }
    .bar-fill { height:100%; background:linear-gradient(90deg,#5cc9bc,#0f766e); border-radius:999px; }
    .bar-value { text-align:right; color:var(--muted); font-size:12px; }
    .pipeline-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:22px; }
    .pipeline-card { border:1px solid var(--line); border-radius:9px; padding:13px; background:#fbfcfe; }
    .pipeline-card .num { font-size:23px; font-weight:750; color:var(--navy); }
    .pipeline-card .name { color:var(--muted); font-size:12px; }
    .kb-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .kb-card { border:1px solid var(--line); border-radius:9px; padding:13px; background:#fff; }
    .kb-card h3 { margin:5px 0 3px; font-size:15px; }
    .kb-card p { color:var(--muted); font-size:12px; margin:7px 0; }
    .skill-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .skill-card { border:1px solid var(--line); border-radius:9px; padding:14px; background:#fff; }
    .skill-card h3 { margin:0 0 5px; font-size:15px; }
    .skill-card p { color:var(--muted); font-size:12px; margin:5px 0; }
    .reply-box { border:1px solid #c7d7f7; background:var(--blue-wash); border-radius:8px; padding:13px; margin-bottom:14px; }
    .reply-box.inbound { border-color:#acd9d2; background:var(--teal-wash); }
    .meeting-list { margin:7px 0 0; padding-left:20px; }
    .meeting-list li { margin:5px 0; }
    .quote-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .quote-field { border:1px solid var(--line); border-radius:8px; padding:10px 11px; background:#fbfcfe; }
    .quote-field .k { color:var(--muted); font-size:12px; }
    .quote-field .v { margin-top:3px; font-weight:700; }
    .crm-lane { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px; margin-bottom:16px; }
    .crm-stage { border:1px solid var(--line); border-radius:8px; padding:10px 8px; text-align:center; color:var(--muted); font-size:12px; background:#fbfcfe; }
    .crm-stage.active { color:var(--teal); border-color:#acd9d2; background:var(--teal-wash); font-weight:750; }
    .activity { border-left:2px solid #b9d7d3; padding-left:13px; margin:9px 0; }
    .activity b { color:var(--navy); }
    .analysis-hero { display:flex; justify-content:space-between; gap:18px; border:1px solid #b9d7d3; background:linear-gradient(135deg,#f0fbf9,#fff); border-radius:10px; padding:15px; }
    .analysis-hero h3 { margin:0; font-size:20px; color:var(--teal); }
    .analysis-hero p { margin:5px 0 0; }
    .analysis-score { min-width:90px; text-align:center; border-left:1px solid #cfe4e0; padding-left:16px; display:flex; flex-direction:column; justify-content:center; }
    .analysis-score strong { font-size:30px; color:var(--navy); line-height:1; }
    .analysis-score span { color:var(--muted); font-size:12px; margin-top:5px; }
    .next-list { margin:0; padding-left:20px; }
    .next-list li { margin:6px 0; }
    .analysis-source { display:flex; flex-direction:column; gap:2px; border-top:1px solid var(--line); margin-top:16px; padding-top:12px; font-size:12px; }
    .analysis-source span { color:var(--muted); }
    .analysis-source em { color:#8a5600; font-style:normal; }
    .calendar-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
    .calendar-day { border:1px solid var(--line); border-radius:8px; padding:10px 8px; min-height:88px; background:#fbfcfe; }
    .calendar-day.active { border-color:#7bcac0; background:var(--teal-wash); }
    .calendar-day .day { font-size:12px; color:var(--muted); }
    .calendar-day .count { font-size:22px; font-weight:750; color:var(--navy); margin-top:8px; }
    .source-card { border:1px solid var(--line); border-radius:9px; padding:13px; background:#fff; }

    .source-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .collection-row { display:grid; grid-template-columns:minmax(190px,1.1fr) 120px 90px 100px minmax(170px,1fr) 110px; gap:10px; align-items:center; border-bottom:1px solid var(--line); padding:12px 0; }
    .collection-row:last-child { border-bottom:0; }
    .collection-status { border-radius:999px; padding:4px 8px; font-size:12px; font-weight:700; text-align:center; }
    .status-ready { color:var(--teal); background:var(--teal-wash); }
    .status-auth { color:var(--amber); background:var(--amber-wash); }
    .status-manual { color:#315d9a; background:var(--blue-wash); }
    .collection-head { color:var(--muted); font-size:12px; font-weight:650; }
    .hidden-view-note { border:1px dashed var(--line); border-radius:8px; padding:12px; color:var(--muted); font-size:12px; }
    .view-guide { border-left:3px solid var(--teal); background:var(--teal-wash); color:var(--ink); border-radius:7px; padding:10px 12px; margin-bottom:16px; font-size:13px; }
    .automation-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .automation-card { border:1px solid var(--line); border-radius:9px; padding:13px; background:#fbfcfe; }
    .automation-card .num { font-size:23px; font-weight:750; color:var(--navy); }
    .automation-card .name { color:var(--muted); font-size:12px; }

    .automation-step:last-child { border-bottom:0; }

    }
  </style>

<body>
  <section id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="brand login-brand"><div class="brand-mark">W</div><span>WorkTex AI</span></div>
      <h1>选择演示工作台</h1>
      <p class="subtitle">这是角色权限演示，不连接真实账号。老板和销售看到的功能不同。</p>
      <div class="login-roles">
        <button class="role-card" data-login="employee"><strong>销售员工账号</strong><span>查看每日线索、客户分析、资料查询、报价和跟进任务</span><em>demo_sales / 123456</em></button>
        <button class="role-card" data-login="owner"><strong>老板账号</strong><span>查看增长来源、团队效率、自媒体线索和系统配置</span><em>demo_owner / 123456</em></button>
      </div>
      <div class="small">所有数据为合成演示数据，不代表真实企业或真实客户。</div>
    </div>
  </section>
  <div class="app" data-demo="synthetic_demo">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">W</div><span>WorkTex AI</span></div>
      <div id="sidebar-nav"></div>
      <div class="side-note">演示模式<br>所有企业、证据、案例和产品参数均为合成数据。知识库和Skills在后台维护，销售只看到分析结果。</div>
    </aside>
    <main class="main">

      document.querySelectorAll('[data-metric]').forEach(button => button.addEventListener('click', () => { const action = button.dataset.metric; if (action === 'materials') { setView('materials'); showToast('已打开销售资料查询'); return; } if (action === 'safety') { showToast('安全规则：系统只生成建议，发送和报价必须由人工确认。'); return; } dateRange = 'all'; chosenDate = '2026-08-17'; collectDateEl.value = chosenDate; sourceFilter = 'all'; sourceFilterEl.value = 'all'; leadBucket = action === 'a' || action === 'hold' ? action : 'all'; searchEl.value = ''; setView('leads'); tab = 'analysis'; render(); showToast(action === 'a' ? '已筛选：建议优先跟进的账户' : action === 'hold' ? '已筛选：需要人工确认的账户' : '已打开全部收集到的线索'); }));
      document.querySelectorAll('.date-btn').forEach(button => button.addEventListener('click', () => { dateRange = button.dataset.range; leadBucket = 'all'; document.querySelectorAll('.date-btn').forEach(b => b.classList.toggle('active', b === button)); renderList(); showToast('已切换到' + (dateRange === 'today' ? chosenDate + '今日' : dateRange === '7d' ? '近7天' : '近30天')); }));
      collectDateEl.addEventListener('change', () => { chosenDate = collectDateEl.value; dateRange = 'custom'; leadBucket = 'all'; document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active')); renderList(); showToast('已查看 ' + chosenDate + ' 的线索'); });
      sourceFilterEl.addEventListener('change', () => { sourceFilter = sourceFilterEl.value; renderList(); });
      document.getElementById('reset-demo').addEventListener('click', () => { selected = leads[0]; tab = 'analysis'; approval = '待人工复核'; searchEl.value = ''; leadBucket = 'all'; dateRange = 'today'; chosenDate = '2026-08-17'; sourceFilter = 'all'; collectDateEl.value = chosenDate; sourceFilterEl.value = 'all'; document.querySelectorAll('.date-btn').forEach(b => b.classList.toggle('active', b.dataset.range === 'today')); setView(role === 'owner' ? 'owner' : 'leads'); render(); showToast('演示已恢复初始状态'); });
      appEl.hidden = true;
      loginScreen.hidden = false;
    })();
  </script>
</body>
</html>
